# Render Blueprint: README'deki "Deploy to Render" butonu bu dosyayı okur.
# Gizli değerler (sync: false) kurulum sırasında Render'ın formuna elle girilir; depoya yazılmaz.
services:
  - type: web
    name: opendelegate
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: WEB_PAROLA # web sohbetinin giriş parolası (en az 12 karakter)
        sync: false
      - key: WEB_TOTP_SIR # doğrulama uygulaması anahtarı (base32); python kurulum.py üretir
        sync: false
      - key: OPENDELEGATE_SIR
        generateValue: true
      - key: DATABASE_URL # Neon Postgres; boş bırakırsanız hafıza geçici olur
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: AJAN_SECRET
        generateValue: true
      - key: SESLI_TOKEN
        generateValue: true
