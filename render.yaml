# Render Blueprint: README'deki "Deploy to Render" butonu bu dosyayı okur.
# Gizli değerler (sync: false) kurulum sırasında Render'ın formuna elle girilir; depoya yazılmaz.
services:
  - type: web
    name: opendelegate
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      # Web sohbetinin giriş şifresi = kys şifresi. `python kurulum.py` bunların özetlerini .env dosyasına yazar; değerleri buraya kopyalayın.
      - key: KILIT_TUZ
        sync: false
      - key: KILIT_OZET
        sync: false
      - key: KILIT_OZET_SADE
        sync: false
      - key: KILIT_KURTARMA_TUZ
        sync: false
      - key: KILIT_KURTARMA_OZET
        sync: false
      - key: WEB_TOTP_SIR # doğrulama uygulaması anahtarı (base32); python kurulum.py üretir
        sync: false
      - key: OPENDELEGATE_SIR
        generateValue: true
      - key: DATABASE_URL # Neon Postgres; boş bırakırsanız hafıza geçici olur
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: AJAN_SECRET
        generateValue: true
      - key: SESLI_TOKEN
        generateValue: true
