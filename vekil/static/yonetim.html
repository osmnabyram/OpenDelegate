<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#050508">
<title>Vekil · Yönetim</title>
<style>
  :root { --zemin:#050508; --kart:#0f070a; --kirmizi:#ff2a1a; --metin:#ffe9e6; --soluk:rgba(255,205,198,.62);
    --cizgi:rgba(255,70,50,.28); --iyi:#4ade80; --kotu:#f87171; --mono:"Cascadia Mono",Consolas,ui-monospace,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--zemin); color:var(--metin); font-family:"Segoe UI",system-ui,sans-serif;
    padding:20px; max-width:880px; margin-inline:auto; }
  h1 { font-family:var(--mono); letter-spacing:.2em; font-size:15px; color:var(--kirmizi); margin:0 0 4px; }
  .alt { color:var(--soluk); font-size:13px; margin-bottom:20px; }
  .izgara { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:12px; }
  .kart { background:var(--kart); border:1px solid var(--cizgi); border-radius:10px; padding:14px; }
  .kart h2 { font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--soluk); margin:0 0 8px;
    font-weight:500; text-transform:uppercase; }
  .buyuk { font-size:22px; font-weight:600; }
  .iyi { color:var(--iyi); } .kotu { color:var(--kotu); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--cizgi); }
  th { font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--soluk); font-weight:500; }
  .soluk { color:var(--soluk); }
  button { background:none; border:1px solid var(--cizgi); color:var(--metin); border-radius:8px; padding:8px 14px;
    font-family:var(--mono); letter-spacing:.1em; cursor:pointer; }
  button:hover { border-color:var(--kirmizi); }
</style>
</head>
<body>
<h1>VEKİL · YÖNETİM</h1>
<div class="alt" id="durum">Yükleniyor...</div>

<div class="izgara">
  <div class="kart"><h2>Model</h2><div class="buyuk" id="model">-</div><div class="soluk" id="dil"></div></div>
  <div class="kart"><h2>Hafıza</h2><div class="buyuk" id="hafiza">-</div><div class="soluk" id="hafizaAlt"></div></div>
  <div class="kart"><h2>PC ajanı</h2><div class="buyuk" id="ajan">-</div></div>
  <div class="kart"><h2>Son yanıt süreleri</h2><div class="buyuk" id="sureler">-</div><div class="soluk">saniye, eskiden yeniye</div></div>
</div>

<div class="izgara">
  <div class="kart"><h2>Kalıcı bilgiler</h2><table id="bilgiler"></table></div>
  <div class="kart"><h2 id="eylemBaslik">Eylemler</h2><table id="eylemler"></table></div>
</div>

<div class="kart">
  <h2>Son işler</h2>
  <table><thead><tr><th>Zaman</th><th>Araç</th><th>Risk</th><th>Durum</th></tr></thead><tbody id="son"></tbody></table>
</div>

<p><button id="yenile">YENİLE</button></p>
<p class="soluk" style="font-size:12px">Konuşma metni ve eylem ayrıntıları bu sayfada gösterilmez. Model maliyeti için DeepSeek panelinize bakın.</p>

<script>
  // Güvenlik: sunucudan gelen her değer textContent ile yazılır; HTML olarak yorumlanmaz.
  const $ = (id) => document.getElementById(id);
  function satir(tablo, a, b) {
    const tr = document.createElement("tr");
    for (const v of [a, b]) { const td = document.createElement("td"); td.textContent = String(v); tr.appendChild(td); }
    tablo.appendChild(tr);
  }
  async function yukle() {
    $("durum").textContent = "Yükleniyor...";
    try {
      const r = await fetch(location.pathname.replace(/\/$/, "") + "/veri", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const v = await r.json();
      $("model").textContent = v.model;
      $("dil").textContent = "Dil: " + (v.dil === "en" ? "İngilizce" : "Türkçe");
      $("hafiza").textContent = v.hafiza.erisilebilir ? "Erişilebilir" : "Erişilemiyor";
      $("hafiza").className = "buyuk " + (v.hafiza.erisilebilir ? "iyi" : "kotu");
      $("hafizaAlt").textContent = v.hafiza.tur === "postgres" ? "Kalıcı (Postgres)" : "Geçici (SQLite)";
      $("ajan").textContent = v.pc_ajani_cevrimici ? "Çevrimiçi" : "Çevrimdışı";
      $("ajan").className = "buyuk " + (v.pc_ajani_cevrimici ? "iyi" : "soluk");
      $("sureler").textContent = v.son_sureler_sn.length ? v.son_sureler_sn.join(" · ") : "henüz yok";
      for (const t of ["bilgiler", "eylemler"]) $(t).replaceChildren();
      const s = v.istatistik;
      $("son").replaceChildren();
      if (s) {
        for (const [tur, n] of Object.entries(s.bilgi_turleri)) satir($("bilgiler"), tur, n);
        satir($("bilgiler"), "özet", s.ozet_adedi);
        satir($("bilgiler"), "mesaj", s.mesaj_adedi);
        $("eylemBaslik").textContent = "Eylemler (son " + s.eylem_gun + " gün)";
        for (const [d, n] of Object.entries(s.eylem_durumlari)) satir($("eylemler"), d, n);
        for (const e of s.son_eylemler) {
          const tr = document.createElement("tr");
          for (const x of [e.zaman.replace("T", " "), e.tool, e.risk, e.durum]) {
            const td = document.createElement("td"); td.textContent = x; tr.appendChild(td);
          }
          $("son").appendChild(tr);
        }
      }
      $("durum").textContent = "Güncellendi: " + new Date().toLocaleTimeString("tr-TR");
    } catch (e) {
      $("durum").textContent = "Veri alınamadı (" + e.message + ")";
    }
  }
  $("yenile").addEventListener("click", yukle);
  yukle();
</script>
</body>
</html>
